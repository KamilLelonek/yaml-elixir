name: Publish the package to Hex

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Verify release version
        run: |
          VERSION=$(grep '^  @version "' mix.exs | sed 's/.*"\(.*\)".*/\1/')

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "Tag v$TAG does not match mix.exs version $VERSION"
              exit 1
            fi
          else
            if ! git tag --points-at HEAD | grep -qx "v$VERSION"; then
              echo "HEAD is not tagged as v$VERSION; refusing to publish"
              exit 1
            fi
          fi

      - name: Install and compile dependencies
        run: mix deps.get + deps.compile

      - name: Run tests
        run: mix test

      - name: Build the package
        run: mix compile + hex.build

      - name: Publish to Hex.pm
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
